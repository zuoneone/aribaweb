    jvmArgs "-DAWAPI.URL=${project.findProperty('AWAPI.URL') ?: 'http://aribaweb.org/api'}"
    jvmArgs "-DAWAPI.RootDirectory=${project.findProperty('AWAPI.RootDirectory') ?: file("${rootDir}/docs/api").absolutePath.replace('\\\\', '/')}"
}

