    classpath += fileTree(dir: "lib/ext", include: ["*.jar"])
    classpath += fileTree(dir: "lib/ext-demo", include: ["*.jar"])
    classpath += configurations.servletApi
    
    // Add library project jars
    classpath += files(
        project(':util').tasks.named('jar'),
        project(':expr').tasks.named('jar'),
        project(':aribaweb').tasks.named('jar'),
        project(':widgets').tasks.named('jar'),
        project(':metaui').tasks.named('jar'),
        project(':groovyloader').tasks.named('jar')
    )
    
    mainClass = 'org.codehaus.groovy.tools.GroovyStarter'
    args = [
        '--main', 'groovy.ui.GroovyMain',
        'bin/indexsource.groovy',
        'doc/index.lucene',
        'doc/api/', '$ARIBAWEB_HOME/docs/api', 'doc',
        'doc/tutorial/', '$ARIBAWEB_HOME/docs/tutorial', 'tutorial',
        'src/aribaweb/', '$ARIBAWEB_HOME/src/aribaweb', 'source',
        'src/widgets/', '$ARIBAWEB_HOME/src/widgets', 'source',
        'src/metaui/', '$ARIBAWEB_HOME/src/metaui', 'source',
        'examples/', '$ARIBAWEB_HOME/examples', 'examples'
    ]
    jvmArgs = getJava17JvmArgs()
}

// 6. Distribution Packaging
tasks.register('srcJar', Zip) {
    group = 'distribution'
    description = 'Packages all source files into a jar'
    archiveFileName = 'ariba.aw-all-src.jar'
    destinationDirectory = file("build/lib")
    
    ["src/util", "src/expr", "src/aribaweb", "src/widgets", "src/metaui", "src/metaui-jpa", "src/awreload"].each { dir ->
        from(dir) {
            include '**/*.java', '**/*.awl', '**/*.groovy', '**/*.js', '**/*.css', '**/*.htm'
            exclude 'build/**'
        }
    }
}

tasks.register('appcoreSrcJar', Zip) {
    group = 'distribution'
    description = 'Packages examples appcore source files into a jar'
    archiveFileName = 'ariba.appcore-src.jar'
    destinationDirectory = file("build/lib")
    
    from("examples/appcore") {
        include '**/*.java', '**/*.awl', '**/*.groovy', '**/*.js', '**/*.css', '**/*.htm'
        exclude 'build/**'
    }
}

tasks.register('packageSrc', Zip) {
    group = 'distribution'
    description = 'Generates the source code distribution zip'
    archiveFileName = "aribaweb-src-${project.version}.zip"
    destinationDirectory = file("dist")
    
    into("aribaweb-${project.version}") {
        from(projectDir) {
            include 'tools/**'
            include 'src/**'
            include 'examples/**'
            include 'lib/ext*/**'
            include 'bin/**'
            include '*'
            exclude 'dist/**'
            exclude 'webapps/**'
            exclude 'work/**'
            exclude 'classes/**'
            exclude 'derived-src/**'
            exclude 'site/**'
            exclude 'build/**'
            exclude '.git/**'
            exclude '.gradle/**'
        }
    }
}

tasks.register('packageBinaryMin', Zip) {
    group = 'distribution'
    description = 'Generates thin binary distribution zip'
    archiveFileName = "aribaweb-${project.version}.zip"
    destinationDirectory = file("dist")
    
    into("aribaweb-${project.version}") {
        from(projectDir) {
            include '**'
            exclude 'dist/**'
            exclude 'conf/**'
            exclude 'work/**'
            exclude 'classes/**'
            exclude 'build/**'
            exclude 'derived-src/**'
            exclude 'webapps/**'
            exclude 'lib/app.*'
            exclude 'bin/**'
            exclude 'site/**'
            exclude '.git/**'
            exclude '.gradle/**'
        }
        // Include bin/ with executable file modes
        from('bin') {
            into 'bin'
            fileMode = 0777
        }
    }
}

tasks.register('package') {
    group = 'distribution'
    description = 'Generates both source and binary distributions'
    dependsOn packageBinaryMin, packageSrc
}

tasks.register('distAll') {
    group = 'distribution'
    dependsOn 'package'
}

// 7. Extend Clean Task
clean {
    delete "dist"
    delete "build"
    delete "doc/api"
    delete "doc/tutorial"
    delete "doc/site"
    delete "doc/index.lucene"
    delete "doc/xsd"
    delete "conf", "logs", "temp", "work"
}

