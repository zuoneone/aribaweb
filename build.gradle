// Check variables for packaging
def antDistDir = System.getenv('ANT_DIST_HOME') ?: (project.findProperty('ant.dist.dir') ?: '')
def tomcatDistDir = System.getenv('TOMCAT_DIST_HOME') ?: (project.findProperty('tomcat.dist.dir') ?: '')
def isFullDist = (antDistDir != '' && tomcatDistDir != '')

task zipBinary(type: Zip) {
    description = "Zips the binary distribution."
    dependsOn jars, wars, srcJar, docs, site, indexDoc
    def ver = "1.0-dev"
    def distDir = file("${rootDir}/dist")
    destinationDirectory = distDir
    archiveFileName = "aribaweb-${ver}.zip"

    into("aribaweb-${ver}") {
        from(rootDir) {
            exclude 'dist/**', 'conf/**', 'work/**', 'classes/**', 'build/**', 'derived-src/**', 'webapps/**', 'lib/app.*', 'bin/**', 'site/**', '.gradle/**', '.git/**', '**/build/**'
        }
        from(rootDir) {
            include 'bin/**'
            fileMode = 0777
        }

        if (isFullDist) {
            into("tools/ant") {
                from(antDistDir) {
                    exclude "bin/**", "docs/**"
                }
            }
            into("tools/ant") {
                from(antDistDir) {
                    include "bin/**"
                    fileMode = 0777
                }
            }
            into("tools/tomcat") {
                from(tomcatDistDir) {
                    include "*", "conf/**", "lib/**"
                }
            }
            into("tools/tomcat") {
                from(tomcatDistDir) {
                    include "bin/**"
                    fileMode = 0777
                }
            }
        }
    }

    doFirst {
        distDir.mkdirs()
    }

    doLast {
        writeChecksum(archiveFile.get().asFile)
    }
}

task packageBinary {
    description = "Packages the binary distribution."
    dependsOn wars, srcJar, docs, site, indexDoc, zipBinary
}

task 'package-binary' {
    dependsOn packageBinary
}

task packageSrc(type: Zip) {
    description = "Packages the source distribution."
    dependsOn jars
    def ver = "1.0-dev"
    def distDir = file("${rootDir}/dist")
    destinationDirectory = distDir
    archiveFileName = "aribaweb-src-${ver}.zip"

    into("aribaweb-${ver}") {
        from(rootDir) {
            include 'tools/**', 'src/**', 'examples/**', 'lib/ext*/**', 'bin/**'
            exclude 'dist/**', 'webapps/**', 'work/**', 'classes/**', 'derived-src/**', 'site/**', '.gradle/**', '.git/**', '**/build/**'
        }
    }

    doFirst {
        distDir.mkdirs()
    }

    doLast {
        writeChecksum(archiveFile.get().asFile)
    }
}

task 'package-src' {
    dependsOn packageSrc
}

task 'package' {
    description = "Packages both binary and source distributions."
    dependsOn packageBinary, packageSrc
}

task incPackageBinary {
    description = "Incremental packaging of binary."
    dependsOn jars, srcJar, zipBinary
}

task 'inc-package-binary' {
    dependsOn incPackageBinary
}

task distAll {
    description = "Builds and packages everything."
    dependsOn 'package'
}

task 'dist-all' {
    dependsOn distAll
}

task ftpDist {
    description = "Uploads distributions via FTP."
    dependsOn distAll
    doLast {
        def ftpHost = System.getenv("ARIBAWEB_FTP_HOST")
        def ftpUser = System.getenv("ARIBAWEB_FTP_USERNAME")
        def ftpPass = System.getenv("ARIBAWEB_FTP_PASSWORD")
        if (!ftpHost || !ftpUser || !ftpPass) {
            throw new GradleException("FTP environment variables (ARIBAWEB_FTP_HOST, ARIBAWEB_FTP_USERNAME, ARIBAWEB_FTP_PASSWORD) must be set.")
        }

        ant.taskdef(name: 'ftp', classname: 'org.apache.tools.ant.taskdefs.optional.net.FTP')
        ant.ftp(server: ftpHost, userid: ftpUser, password: ftpPass, remotedir: '/incoming', action: 'send') {
            fileset(dir: "${rootDir}/dist") {
                include(name: "*.zip")
            }
        }
    }
}

task 'ftp-dist' {
    dependsOn ftpDist
}

task clean(type: Delete) {
    delete buildDir
    delete fileTree(dir: "${rootDir}/lib", include: "*.jar")
    delete "${rootDir}/webapps"
    delete "${rootDir}/dist"
    delete "${rootDir}/work"
    delete "${rootDir}/docs/api"
    delete "${rootDir}/docs/tutorial"
    delete "${rootDir}/docs/site"
    delete "${rootDir}/docs/index.lucene"
    delete "${rootDir}/docs/xsd"
    subprojects.each { sub ->
        delete sub.layout.buildDirectory
    }
}

