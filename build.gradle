def getBuildClasspath() {
    def servletJar = new File("${rootProject.ext.awTomcatHome}/lib/servlet-api.jar").exists() ? "${rootProject.ext.awTomcatHome}/lib/servlet-api.jar" : (new File("${rootDir}/tools/tomcat/lib/servlet-api.jar").exists() ? "${rootDir}/tools/tomcat/lib/servlet-api.jar" : "${rootDir}/lib/ext-build/javax.servlet.zip")
    def extBuildTree = fileTree(dir: "${rootDir}/lib/ext-build", include: "*.jar")
    extBuildTree.exclude 'javax.servlet.zip'

    def coreProjectNames = ['util', 'expr', 'aribaweb-core', 'widgets', 'metaui', 'groovyloader', 'awreload', 'awreload-adaptor-jdk15']
    def coreJars = fileTree(dir: "${rootDir}/lib", include: "ariba.*.jar")
    coreJars.exclude 'ariba.appcore.jar'
    coreJars.exclude 'ariba.AtIssue.jar'
    coreJars.exclude 'ariba.Demo.jar'
    coreJars.exclude 'ariba.GuestBook.jar'
    coreJars.exclude 'ariba.MasterDetail.jar'
    coreJars.exclude 'ariba.site.jar'
    coreJars.exclude 'ariba.metaui-jpa.jar'
    coreJars.exclude 'ariba.*-src.jar'

    def coreRuntimeClasspaths = subprojects.findAll { coreProjectNames.contains(it.name) }.collect { it.sourceSets.main.runtimeClasspath }

    return files(
        servletJar,
        fileTree(dir: "${rootDir}/lib/ext", include: "*.jar"),
        extBuildTree,
        coreJars,
        coreRuntimeClasspaths
    )
}

def getTomcatHome() {
    if (new File("${rootDir}/tools/tomcat").exists()) {
        return "${rootDir}/tools/tomcat"
    } else if (new File(rootProject.ext.awTomcatHome).exists()) {
        return rootProject.ext.awTomcatHome
    }
    return ""
}

task 'ensure-tomcat-conf' {
    description = "Copies Tomcat configuration files to AW_HOME/conf."
    doLast {
        def tomcatHome = getTomcatHome()
        def confDir = file("${rootDir}/conf")
        if (!file("${confDir}/server.xml").exists()) {
            println "Copying Tomcat configuration from ${tomcatHome}/conf to ${confDir}..."
            confDir.mkdirs()
            copy {
                from "${tomcatHome}/conf"
                into confDir
            }
            
            // Check if port prefix override is specified
            if (project.hasProperty('tomcat.port.prefix.override')) {
                def pre = project.property('tomcat.port.prefix.override')
                println "Updating tomcat server.xml with port prefix: ${pre}"
                def serverXml = file("${confDir}/server.xml")
                if (serverXml.exists()) {
                    def conf = serverXml.text.replace("port=\"8", "port=\"" + pre)
                    conf = conf.replace("Port=\"8", "Port=\"" + pre)
                    serverXml.text = conf
                }
            }
        }

        // Always restrict common.loader in catalina.properties to exclude catalina.base libs
        def catalinaProperties = file("${confDir}/catalina.properties")
        if (catalinaProperties.exists()) {
            def props = catalinaProperties.text
            if (props.contains('common.loader="${catalina.base}/lib"')) {
                println "Updating tomcat catalina.properties to restrict common.loader..."
                props = props.replaceAll(/(?ms)^common\.loader=.*?(?=^server\.loader=)/) {
                    'common.loader="${catalina.home}/lib","${catalina.home}/lib/*.jar"\n\n'
                }
                catalinaProperties.text = props
            }
        }
    }
}

def configureTomcat(JavaExec execTask) {
    execTask.dependsOn webapps
    execTask.dependsOn 'ensure-tomcat-conf'

    def tomcatHome = getTomcatHome()
    execTask.mainClass = 'org.apache.catalina.startup.Bootstrap'
    execTask.classpath = files(
        "${tomcatHome}/bin/bootstrap.jar",
        "${tomcatHome}/bin/tomcat-juli.jar"
    )

    execTask.jvmArgs = [
        '-Djava.util.logging.manager=org.apache.juli.ClassLoaderLogManager',
        "-Djava.util.logging.config.file=${rootDir}/conf/logging.properties",
        '-Xmx256m',
        '-Dariba.aribaweb.Debug=false',
        "-Dcatalina.home=${tomcatHome}",
        "-Dcatalina.base=${rootDir}",
        '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
        '--add-opens=java.base/java.util=ALL-UNNAMED',
        '--add-opens=java.base/java.io=ALL-UNNAMED',
        '--add-opens=java.base/java.nio=ALL-UNNAMED',
        '--add-opens=java.base/java.math=ALL-UNNAMED',
        '--add-opens=java.base/java.net=ALL-UNNAMED',
        '--add-opens=java.base/java.text=ALL-UNNAMED',
        '--add-opens=java.base/java.util.regex=ALL-UNNAMED',
        '--add-opens=java.rmi/sun.rmi.transport=ALL-UNNAMED',
        '--add-opens=java.xml/com.sun.org.apache.xerces.internal.dom=ALL-UNNAMED'
    ]

    execTask.environment 'CATALINA_HOME', tomcatHome
    execTask.environment 'ARIBAWEB_HOME', "${rootDir}"
    execTask.environment 'AW_HOME', "${rootDir}"
    execTask.environment 'AW_RELOAD_CLASSES_ROOT', "${buildDir}/classes"

    def searchPaths = []
    subprojects.each { sub ->
        searchPaths << sub.projectDir.absolutePath
    }
    // execTask.environment 'ARIBA_AW_SEARCH_PATH', searchPaths.join(';')

    execTask.doFirst {
        println "Starting Tomcat on http://localhost:8080/ (or alternate port in server.xml)..."
    }
}

