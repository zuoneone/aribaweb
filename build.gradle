task site(type: JavaExec) {
    description = "Generates the static site."
    dependsOn jars
    doFirst {
        def siteDir = file("${rootDir}/site")
        delete siteDir
        siteDir.mkdirs()
        def siteSrc = file("${rootDir}/src/site")
        copy {
            from "${siteSrc}/docroot"
            into siteDir
        }

        def tmpScript = file("${buildDir}/tmp/generatesite.groovy")
        tmpScript.parentFile.mkdirs()
        tmpScript.text = """
            import ariba.ui.aribaweb.core.AWConcreteApplication
            import ariba.ui.aribaweb.util.AWNamespaceManager
            import ariba.ui.aribaweb.util.AWStaticSiteGenerator

            Thread.currentThread().setContextClassLoader(AWConcreteApplication.class.getClassLoader())
            System.getProperties()["AWAPI.URL"] = "${project.findProperty('AWAPI.URL') ?: 'http://aribaweb.org/api'}"
            System.getProperties()["AWAPI.RootDirectory"] = "${project.findProperty('AWAPI.RootDirectory') ?: file("${rootDir}/docs/api").absolutePath.replace('\\', '/')}"
            println "AWAPI.URL = \${System.getProperties()['AWAPI.URL']}"
            println "Generating to ${siteDir.absolutePath.replace('\\', '/')}"
            AWStaticSiteGenerator.main(["${siteDir.absolutePath.replace('\\', '/')}", "${siteSrc.absolutePath.replace('\\', '/')}", ".", "http://aribaweb.org"] as String[])
        """
    }

    mainClass = 'groovy.ui.GroovyMain'
    classpath = getGroovyAppClasspath()
    args = ["${buildDir}/tmp/generatesite.groovy"]
}

task runSite(type: JavaExec) {
