task groovy(type: JavaExec) {
    description = "Runs a Groovy script specified by -Pscript and -Pargs."
    mainClass = 'groovy.ui.GroovyMain'
    classpath = getGroovyScriptClasspath()

    doFirst {
        if (!project.hasProperty('script')) {
            throw new GradleException("Please specify the script to run using -Pscript=/path/to/script.groovy")
        }
        args = [project.property('script')]
        if (project.hasProperty('args')) {
            args.addAll(project.property('args').split(' '))
        }
    }
}

