}

task tomcatBrowse(type: JavaExec) {
    description = "Starts Tomcat and opens the app in the browser."
    configureTomcat(it)
    doFirst {
        Thread.start {
            def appUrl = "http://localhost:8080/Demo/AribaWeb"
            println "Browser launcher thread started. Waiting for Tomcat to respond at ${appUrl}..."
            long startTime = System.currentTimeMillis()
            boolean success = false
            while (System.currentTimeMillis() - startTime < 45000) {
                try {
                    Thread.sleep(1000)
                    def connection = new URL("http://localhost:8080/Demo/ad/ping").openConnection() as HttpURLConnection
                    connection.requestMethod = "GET"
                    connection.connectTimeout = 1000
                    connection.readTimeout = 1000
                    int code = connection.responseCode
                    if (code == 200) {
                        success = true
                        break
                    }
                } catch (Exception e) {
                    // ignore
                }
            }
            if (success) {
                println "Tomcat is up! Opening ${appUrl} in browser..."
                if (System.getProperty("os.name").toLowerCase().contains("windows")) {
                    Runtime.getRuntime().exec("cmd /c start " + appUrl)
                } else {
                    try {
                        Runtime.getRuntime().exec("xdg-open " + appUrl)
                    } catch (Exception e) {
                        try {
                            Runtime.getRuntime().exec("open " + appUrl)
                        } catch (Exception ex) {
                            println "Could not open browser automatically: ${ex.message}"
                        }
                    }
                }
            } else {
                println "Tomcat ping timed out or failed. Not opening browser."
            }
        }
    }
}

