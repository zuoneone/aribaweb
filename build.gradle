// Custom task to run AWEvaluateTemplateFile natively using the built project's classpath
abstract class EvaluateTemplateTask extends JavaExec {
    @Input
    abstract MapProperty<String, String> getTemplateProperties()

    @InputFile
    abstract RegularFileProperty getTemplateFile()

    @OutputFile
    abstract RegularFileProperty getOutputFile()

    EvaluateTemplateTask() {
        mainClass.set('ariba.ui.aribaweb.util.AWEvaluateTemplateFile')
    }

    @TaskAction
    void exec() {
        File propsFile = File.createTempFile("gradle_eval", ".properties")
        propsFile.deleteOnExit()
        Properties props = new Properties()
        templateProperties.get().each { k, v -> props.setProperty(k, v) }
        propsFile.withOutputStream { props.store(it, null) }

        args = [
            templateFile.get().asFile.absolutePath,
            propsFile.absolutePath,
            outputFile.get().asFile.absolutePath
        ]

        super.exec()
    }
}

subprojects {
    repositories {
        mavenCentral()
    }
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
        options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked"
    }

    // Default configuration for Java projects. 
    // Subprojects with Groovy (examples, site) will override this in their own build.gradle.
    sourceSets {
        main {
            java {
                srcDirs = ['.']
                include 'ariba/**/*.java'
            }
            resources {
                srcDirs = ['.']
                include 'ariba/**/*.awl'
                include 'ariba/**/*.htm'
                include 'ariba/**/*.oss'
                include 'ariba/**/*.awz'
                include 'ariba/**/*.afr'
                include 'ariba/**/*.csv'
                include 'ariba/**/*.xml'
                include 'ariba/**/*.properties'
                exclude 'build/**'
                exclude 'ariba/resource/**'
                exclude 'resource/**'
            }
        }
    }

    jar {
        duplicatesStrategy = 'exclude'
        destinationDirectory = file("${rootDir}/lib")
        archiveFileName = "ariba.${project.name}.jar"
        metaInf {
            from("${rootDir}/LICENSE.txt")
            from("${rootDir}/NOTICE.txt")
            if (file("aribaweb.properties").exists()) {
                from("aribaweb.properties")
            }
        }
    }


    dependencies {
        implementation fileTree(dir: "${rootDir}/lib/ext", include: ['*.jar', '*.zip'])
        def extBuildTree = fileTree(dir: "${rootDir}/lib/ext-build", include: ['*.jar', '*.zip'])
        extBuildTree.exclude 'javax.servlet.zip'
        implementation extBuildTree
        if (new File("${rootDir}/tools/tomcat/lib/servlet-api.jar").exists()) {
            println "Project ${project.name}: Using tools servlet-api"
            implementation files("${rootDir}/tools/tomcat/lib/servlet-api.jar")
        } else if (new File("${rootProject.ext.awTomcatHome}/lib/servlet-api.jar").exists()) {
            println "Project ${project.name}: Using Tomcat 9.0 servlet-api"
            implementation files("${rootProject.ext.awTomcatHome}/lib/servlet-api.jar")
        } else {
            println "Project ${project.name}: Using fallback javax.servlet.zip"
            implementation files("${rootDir}/lib/ext-build/javax.servlet.zip")
        }
    }

    tasks.withType(GroovyCompile).configureEach {
        groovyClasspath = files("${rootDir}/lib/ext/groovy-all.jar")
    }

    plugins.withId('war') {
        tasks.named('jar') {
            enabled = true
        }

        tasks.named('war') {
            duplicatesStrategy = 'exclude'
            classpath = classpath - project.sourceSets.main.output
            from(tasks.named('jar')) {
                into 'WEB-INF/lib'
            }
            rootProject.subprojects.each { sub ->
                dependsOn sub.tasks.named('processResources')
                from(sub.tasks.named('processResources')) {
                    include 'docroot/**'
                }
            }
        }

        task explodeWar(type: Sync) {
            dependsOn tasks.named('war')
            from zipTree(tasks.named('war').flatMap { it.archiveFile })
            into file("${rootDir}/webapps/${project.name}")
        }
    }
}

ext.EvaluateTemplateTask = EvaluateTemplateTask

import java.security.MessageDigest

// Helper methods for packaging and MD5 generation
def calculateMD5(File file) {
    def digest = MessageDigest.getInstance("MD5")
    file.withInputStream { is ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = is.read(buffer)) > 0) {
            digest.update(buffer, 0, read)
        }
    }
    return new BigInteger(1, digest.digest()).toString(16).padLeft(32, '0')
}

def writeChecksum(File zipFile) {
    def hash = calculateMD5(zipFile)
    def checksumFile = file("${zipFile.absolutePath}.md5")
    checksumFile.text = "${hash}  ${zipFile.name}\n"
    println "Checksum generated: ${checksumFile.absolutePath}"
}

