task tomcatExec(type: Exec) {
    description = "Builds webapps, then runs Tomcat using catalina script."
    dependsOn webapps
    dependsOn 'ensure-tomcat-conf'

    def tomcatHome = getTomcatHome()
    def catalinaCommand = System.getProperty("os.name").toLowerCase().contains("windows") ? 'catalina.bat' : 'catalina.sh'
    def tomcatBin = "${tomcatHome}/bin"
    workingDir rootDir

    executable "${tomcatBin}/${catalinaCommand}"
    args 'jpda', 'run'

    environment 'CATALINA_BASE', "${rootDir}"
    environment 'CATALINA_HOME', tomcatHome
    environment 'ARIBAWEB_HOME', "${rootDir}"
    environment 'ARIBA_AW_SEARCH_PATH', subprojects.collect { it.projectDir.absolutePath }.join(';')

    doFirst {
        println "Launching tomcat with CATALINA_BASE=${rootDir}..."
    }
}

task 'tomcat-exec' {
    dependsOn tomcatExec
}

task 'tomcat-build-exec' {
    dependsOn tomcatExec
}

