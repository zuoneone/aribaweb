description = 'AribaWeb Expression Engine'

dependencies {
    api project(':util')
}

def generatedSourceDir = file("src-gen")

tasks.register('generateParser') {
    def outputDir = file("${generatedSourceDir}/ariba/util/expr")
    def jjtFile = file("ariba/util/expr/expr.jjt")
    def jjFile = file("${generatedSourceDir}/ariba/util/expr/expr.jj")

    inputs.file jjtFile
    outputs.dir outputDir

    doLast {
        outputDir.mkdirs()

        // Step 1: Run jjtree to generate expr.jj
        javaexec {
            workingDir = projectDir
            classpath = files("${rootProject.projectDir}/lib/ext-build/javacc.jar")
            mainClass = 'org.javacc.jjtree.Main'
            args = [
                "-BUILD_NODE_FILES=false",
                "-OUTPUT_DIRECTORY=src-gen/ariba/util/expr",
                "ariba/util/expr/expr.jjt"
            ]
        }

        // Delete duplicate base node files already checked in
        delete "${generatedSourceDir}/ariba/util/expr/Node.java"
        delete "${generatedSourceDir}/ariba/util/expr/SimpleNode.java"

        // Fix the first line comment backslashes in all generated files to avoid compiler unicode escape parsing errors
        fileTree(generatedSourceDir).each { file ->
            if (file.isFile()) {
                def lines = file.readLines()
                if (lines.size() > 0 && lines[0].contains('\\')) {
                    lines[0] = lines[0].replace('\\', '/')
                    file.setText(lines.join('\n'), 'UTF-8')
                }
            }
        }

        // Step 2: Run javacc on the generated expr.jj to generate Java sources
        javaexec {
            workingDir = projectDir
            classpath = files("${rootProject.projectDir}/lib/ext-build/javacc.jar")
            mainClass = 'org.javacc.parser.Main'
            args = [
                "-OUTPUT_DIRECTORY=src-gen/ariba/util/expr",
                "src-gen/ariba/util/expr/expr.jj"
            ]
        }

        // Clean up again after JavaCC runs to sanitize files generated by JavaCC
        fileTree(generatedSourceDir).each { file ->
            if (file.isFile()) {
                def lines = file.readLines()
                if (lines.size() > 0 && lines[0].contains('\\')) {
                    lines[0] = lines[0].replace('\\', '/')
                    file.setText(lines.join('\n'), 'UTF-8')
                }
            }
        }
    }
}

sourceSets {
    main {
        java {
            srcDir generatedSourceDir
        }
        resources {
            exclude 'src-gen/**'
        }
    }
}

compileJava.dependsOn generateParser
processResources.dependsOn generateParser

clean.doFirst {
    delete generatedSourceDir
}


