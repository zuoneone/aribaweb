description = 'AribaWeb UI Framework Core'

dependencies {
    api project(':expr')
}

// Merge javascript files as done in Ant
tasks.register('mergeJs') {
    inputs.files(fileTree(dir: 'resource/webserver', include: ['*.js']))
    
    def classpathDest = layout.buildDirectory.file('resources/main/ariba/ui/aribaweb/aribaweb_all.js')
    def docrootDest = layout.buildDirectory.file('resources/main/docroot/ariba/ui/aribaweb/aribaweb_all.js')
    
    outputs.files(classpathDest, docrootDest)

    doLast {
        def tempFile = file("${buildDir}/tmp/aribaweb_all_uncompacted.js")
        tempFile.parentFile.mkdirs()
        
        def mergeFiles = [
            'jquery.js', 'Util.js', 'Dom.js', 'Event.js', 
            'Input.js', 'Request.js', 'Refresh.js', 'Handlers.js'
        ].collect { file("resource/webserver/$it") }

        tempFile.withWriter { writer ->
            mergeFiles.each { file ->
                if (file.exists()) {
                    writer << file.text << "\n"
                }
            }
        }
        
        // Compact using YUICompressor
        [classpathDest.get().asFile, docrootDest.get().asFile].each { destFile ->
            destFile.parentFile.mkdirs()
            javaexec {
                classpath = files("${rootProject.projectDir}/lib/ext-build/yuicompressor-2.3.5.jar")
                mainClass = 'com.yahoo.platform.yui.compressor.YUICompressor'
                args = ['--line-break', '0', tempFile.absolutePath, '-o', destFile.absolutePath]
            }
        }
        
        // Clean up temp file
        tempFile.delete()
    }
}

processResources {
    dependsOn mergeJs
    
    // Copy unmerged debug JS files
    from('resource/webserver') {
        include 'Debug.js', 'AWJSDebugWin.js'
        into 'ariba/ui/aribaweb'
    }
    
    // Copy docroot resources
    from('resource/webserver') {
        into 'docroot/ariba/ui/aribaweb'
    }
}
