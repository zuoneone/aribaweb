dependencies {
    implementation project(':util')
    implementation project(':expr')
}

jar {
    archiveFileName = 'ariba.aribaweb.jar'
}

task mergeJs(type: JavaExec) {
    def jsFiles = files(
        'resource/webserver/jquery.js',
        'resource/webserver/Util.js',
        'resource/webserver/Dom.js',
        'resource/webserver/Event.js',
        'resource/webserver/Input.js',
        'resource/webserver/Request.js',
        'resource/webserver/Refresh.js',
        'resource/webserver/Handlers.js'
    )
    inputs.files jsFiles
    outputs.file file("${buildDir}/generated/js/abacusweb_all.js")

    classpath = files("${rootDir}/lib/ext-build/yuicompressor-2.3.5.jar")
    mainClass = 'com.yahoo.platform.yui.compressor.YUICompressor'

    doFirst {
        file("${buildDir}/generated/js").mkdirs()
        def merged = file("${buildDir}/generated/js/merged.js")
        merged.withOutputStream { os ->
            jsFiles.each { f ->
                f.withInputStream { is ->
                    os << is
                }
                os.write('\n'.getBytes('UTF-8'))
            }
        }
    }

    args = [
        '--line-break', '0',
        file("${buildDir}/generated/js/merged.js").absolutePath,
        '-o', file("${buildDir}/generated/js/abacusweb_all.js").absolutePath
    ]
}

processResources {
    dependsOn mergeJs
    inputs.file file("${buildDir}/generated/js/abacusweb_all.js")

    // Copy normal docroot files excluding the source JS files that were merged
    from('resource/webserver') {
        into 'docroot/abacus/ui/abacusweb'
        exclude 'jquery.js'
        exclude 'Util.js'
        exclude 'Dom.js'
        exclude 'Event.js'
        exclude 'Input.js'
        exclude 'Request.js'
        exclude 'Refresh.js'
        exclude 'Handlers.js'
    }

    // Copy the merged abacusweb_all.js to docroot
    from("${buildDir}/generated/js") {
        into 'docroot/abacus/ui/abacusweb'
        include 'abacusweb_all.js'
    }

    from('resource/ariba') {
        include 'resource/**/*'
    }
}
