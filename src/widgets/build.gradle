description = 'AribaWeb Widgets Framework'

dependencies {
    api project(':aribaweb')
}

tasks.register('mergeJs') {
    inputs.files(fileTree(dir: 'resource/webserver/widg', include: ['*.js']))
    
    def classpathDest = layout.buildDirectory.file('resources/main/ariba/ui/widg/widgets_all.js')
    def docrootDest = layout.buildDirectory.file('resources/main/docroot/ariba/ui/widg/widgets_all.js')
    
    outputs.files(classpathDest, docrootDest)

    doLast {
        def tempFile = file("${buildDir}/tmp/widgets_all_uncompacted.js")
        tempFile.parentFile.mkdirs()
        
        def mergeFiles = [
            'DragDrop.js', 'Widgets.js', 'Menu.js', 'Chooser.js', 'Datatable.js', 'Calendar.js'
        ].collect { file("resource/webserver/widg/$it") }

        tempFile.withWriter { writer ->
            mergeFiles.each { file ->
                if (file.exists()) {
                    writer << file.text << "\n"
                }
            }
        }
        
        // Compact using YUICompressor
        [classpathDest.get().asFile, docrootDest.get().asFile].each { destFile ->
            destFile.parentFile.mkdirs()
            javaexec {
                classpath = files("${rootProject.projectDir}/lib/ext-build/yuicompressor-2.3.5.jar")
                mainClass = 'com.yahoo.platform.yui.compressor.YUICompressor'
                args = ['--line-break', '0', tempFile.absolutePath, '-o', destFile.absolutePath]
            }
        }
        
        // Clean up temp file
        tempFile.delete()
    }
}

processResources {
    dependsOn mergeJs

    // Copy resource/global to ariba/resource/global
    from('resource/global') {
        into 'ariba/resource/global'
    }

    // Docroot gif copy
    from('.') {
        include 'ariba/**/*.gif'
        exclude 'ariba/ui/richtext/xinha/'
        into 'docroot'
    }

    // Xinha copy
    from('.') {
        include 'ariba/ui/richtext/xinha/*.js'
        include 'ariba/ui/richtext/xinha/*.css'
        include 'ariba/ui/richtext/xinha/modules/**'
        include 'ariba/ui/richtext/xinha/lang/**'
        include 'ariba/ui/richtext/xinha/skins/ariba/**'
        include 'ariba/ui/richtext/xinha/images/**'
        include 'ariba/ui/richtext/xinha/popups/blank.html'
        into 'docroot'
    }

    // Webserver resources
    from('resource/webserver') {
        into 'docroot/ariba/ui'
    }

    // Branding resources
    from('resource/webserver/branding/ariba') {
        into 'docroot/ariba/branding'
    }

    // Unmerged JS copy
    from('resource/webserver/widg') {
        include 'ModalWindow.js', 'prettify.js', 'richtext.js', 'flashchart.js'
        into 'ariba/ui/widg'
    }
}
